services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Local-only convenience. Public deployments should require authentication first.
      ENABLE_COMPANY_IMPORT: "true"

  frontend:
    build:
      context: ./frontend
    environment:
      # Next.js proxies browser requests to FastAPI over the Compose service network.
      BACKEND_API_URL: http://backend:8000
    ports:
      - "3001:3000"
    depends_on:
      - backend
